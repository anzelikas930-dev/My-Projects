<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Скриншоты — RailCanyon</title>
    <style>
        body {
            background: black;
            color: lime;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: red;
            text-align: center;
            font-size: 32px;
            text-shadow: 2px 2px 4px black;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .gallery img {
            width: 90%;
            max-width: 400px;
            border: 2px solid lime;
            border-radius: 10px;
        }
        .gallery p {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px;
            border-radius: 5px;
            color: orange;
            font-size: 14px;
            text-align: center;
        }
        a {
            color: lime;
            text-decoration: none;
            border: 1px solid lime;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
        }
        a:hover {
            background: lime;
            color: black;
        }
    </style>
</head>
<body>
    <h1>СКРИНШОТЫ</h1>
    <div class="gallery">
        <div>
            <img src="hospital.jpg" alt="Больница">
            <p>Больница №75 — Incident №12</p>
        </div>
        <div>
            <img src="patient0.jpg" alt="Пациент 0">
            <p>Пациент 0</p>
        </div>
        <div>
            <img src="abaza.jpg" alt="Абаза">
            <p>Абаза-97</p>
        </div>
        <div>
            <img src="fearzone.jpg" alt="Fear Zone">
            <p>Fear Zone — вдохновение</p>
        </div>
        <div>
            <img src="godot.jpg" alt="Godot">
            <p>Создание игры в Godot</p>
        </div>
        <div>
            <img src="pocketcode.jpg" alt="Pocket Code">
            <p>Создание игры в Pocket Code</p>
        </div>
    </div>
    <a href="index.html">← Назад в меню</a>
</body>
</html>
